<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KartikCart | Shop Smart</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="navbar">
      <a href="#home" class="logo">Kartik<span>Cart</span></a>

      <nav>
        <a href="#home">Home</a>
        <a href="#products">Shop</a>
      </nav>

      <button class="cart-button" onclick="toggleCart()">
        🛒 Cart (<span id="count">0</span>)
      </button>
    </header>

    <main>
      <section class="shop-section" id="products">
        <h2>Find Your Favourites</h2>

        <div class="filters">
          <input type="search" id="search" placeholder="Search products..." />

          <select id="category">
            <option value="All">All Categories</option>
            <option value="Electronics">Electronics</option>
            <option value="Clothing">Clothing</option>
            <option value="Footwear">Footwear</option>
          </select>

          <select id="sort">
            <option value="featured">Featured</option>
            <option value="low">Price: Low to High</option>
            <option value="high">Price: High to Low</option>
          </select>
        </div>

        <p id="resultCount">5 products</p>
        <div id="productGrid" class="product-grid"></div>
      </section>
    </main>

    <div id="cartPanel" class="cart-panel">
      <button class="close-btn" onclick="toggleCart()">×</button>
      <h2>Your Shopping Cart</h2>

      <div id="cartItems"></div>

      <div class="cart-total">
        <p>Subtotal: <strong id="subtotal">₹0</strong></p>
        <p>Discount: <strong id="discount">₹0</strong></p>
        <h3>Total: <span id="total">₹0</span></h3>
      </div>

      <div class="coupon">
        <input id="coupon" placeholder="Coupon code" />
        <button onclick="applyCoupon()">Apply</button>
      </div>

      <p id="message"></p>
      <button class="checkout-btn" onclick="checkout()">Place Order</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
